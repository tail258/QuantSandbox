    </pattern>
    <linearGradient id="fade" x1="690" y1="180" x2="1250" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EA9FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8EA9FF" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#10141D"/>
  <rect x="680" y="20" width="580" height="320" fill="url(#grid)"/>
  <path d="M707 222H795L843 183H913L956 137H1018L1060 96H1188" stroke="url(#fade)" stroke-width="3"/>
