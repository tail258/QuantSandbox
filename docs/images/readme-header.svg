    <text x="199" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" letter-spacing="2" fill="#A4B1CA">历史分叉</text>
    <text x="335" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" letter-spacing="2" fill="#A4B1CA">稳健性实验</text>
    <text x="490" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" letter-spacing="2" fill="#60C4A4">证据重放</text>
