  <path d="M913 183H955L1006 268H1153" stroke="#75839C" stroke-width="2" stroke-dasharray="5 7" stroke-opacity=".55"/>
  <circle cx="913" cy="183" r="20" fill="#8EA9FF" fill-opacity=".08"/>
  <circle cx="913" cy="183" r="7" fill="#10141D" stroke="#8EA9FF" stroke-width="3"/>
  <circle cx="1188" cy="96" r="5" fill="#8EA9FF"/>
  <circle cx="1215" cy="190" r="5" fill="#60C4A4"/>
  <circle cx="1153" cy="268" r="4" fill="#75839C"/>
  <g transform="translate(58 55) scale(1.3)" stroke="#8EA9FF" stroke-width="5">
    <path d="M11 5a12 12 0 0 1 10 0M25 10a12 12 0 0 1 0 12M21 27a12 12 0 0 1-10 0M6 22a12 12 0 0 1 0-12"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="114" y="82" font-size="13" letter-spacing="3" fill="#9BA9C3">LOCAL QUANT RESEARCH</text>
    <text x="60" y="165" font-size="61" font-weight="650" letter-spacing="-2" fill="#EEF2FA">QuantSandbox</text>
    <text x="63" y="214" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#B9C5DA">本地量化研究工作台</text>
