name: Bug report
description: Report a reproducible problem with the workbench.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use a minimal synthetic reproduction whenever possible. Do not upload personal caches, research archives, original attachments, notes, vault settings, tokens, or unredacted screenshots. For a suspected vulnerability, follow [SECURITY.md](https://github.com/tail258/QuantSandbox/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page or command, exact parameters, and a small synthetic input or public-source reference. Do not attach a personal database.
      placeholder: |
        1. Start from ...
        2. Set ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Release or commit, OS, browser, and relevant Python/Node versions. For a UI issue, include language, theme, and viewport.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and data provenance
      description: Optional error text or screenshot. For data-dependent problems, include source URL, units, observation/report date, known publication date, fetch time, price adjustment, and fixed snapshot identifier or hash if safe. Mark unknown dates as unknown. Cache uploads are not required.
  - type: textarea
    id: checks
    attributes:
      label: Checks or workarounds tried
      description: Include relevant test results or whether the same fixed input reproduces the issue. Avoid fetching a replacement snapshot just to make results match.
